spring.application.name=ezfinanz-backend
# Render sets PORT; local uses SERVER_PORT / 8080
server.port=${PORT:${SERVER_PORT:8080}}

# Values come from backend/.env (local) or real environment variables (deploy).
# Copy backend/.env.example → backend/.env and fill secrets. Do not commit .env.

# PostgreSQL — database name is ezfinanz locally, or postgres on Supabase
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ezfinanz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase Storage (KYC / selfie / knowledge files)
app.supabase.url=${SUPABASE_URL:}
app.supabase.key=${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_ANON_KEY:}}
app.supabase.bucket=${SUPABASE_STORAGE_BUCKET:ezfinanz-files}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Email Configuration (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.default-encoding=UTF-8

# CORS — frontend Vite dev server
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Seeded admin (same login page as customers)
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.full-name=${APP_ADMIN_FULL_NAME:EZFINANZ Admin}

# Help & Support — customer messages are emailed here (defaults to super admin)
app.support.notify-email=${APP_SUPPORT_NOTIFY_EMAIL:}

# OpenAI (RAG chatbot)
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
app.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
app.openai.embedding-dimensions=${OPENAI_EMBEDDING_DIMENSIONS:1024}

# Pinecone (RAG knowledge base)
app.pinecone.api-key=${PINECONE_API_KEY:}
app.pinecone.index-host=${PINECONE_INDEX_HOST:}
app.pinecone.namespace=${PINECONE_NAMESPACE:ezfinanz-support}

# Google OAuth (redirect flow)
app.google.client-id=${APP_GOOGLE_CLIENT_ID:}
app.google.client-secret=${APP_GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${APP_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# OTP
app.otp.ttl-minutes=${APP_OTP_TTL_MINUTES:10}

# Twilio SMS (trial accounts cannot send custom SMS text — OTP uses Twilio Verify)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Local file storage
app.files.directory=${APP_FILES_DIRECTORY:uploads}

# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
